# rust-clippy is a tool that runs a bunch of lints to catch common
# mistakes in your Rust code and help improve your Rust code.
# More details at https://github.com/rust-lang/rust-clippy
# and https://rust-lang.github.io/rust-clippy/

name: rust-clippy analyze

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Filtro_Rust/**'
      - '.github/workflows/rust-clippy.yml'
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
    paths:
      - 'Filtro_Rust/**'
      - '.github/workflows/rust-clippy.yml'
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:

env:
  # Run JavaScript actions on Node 24 instead of the default Node 20
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: clippy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-clippy-analyze:
    name: Run rust-clippy analyzing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by upload-sarif to get the Action run status

    # The crate lives in Filtro_Rust/, not at the repository root
    defaults:
      run:
        working-directory: Filtro_Rust

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # actions-rs/toolchain has been unmaintained since 2022: replaced by dtolnay/rust-toolchain
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Filtro_Rust

      - name: Install required cargo
        run: cargo install clippy-sarif sarif-fmt --locked

      - name: Run rust-clippy
        run: |
          cargo clippy --all-features --all-targets --message-format=json \
            | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          # Path is relative to the repository root, not to the working-directory
          sarif_file: Filtro_Rust/rust-clippy-results.sarif
          wait-for-processing: true

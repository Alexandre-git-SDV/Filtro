# This workflow installs the Python dependencies, checks code quality with Pylint
# and verifies that the Flask application imports correctly.
name: Python CI

on:
  push:
    branches: [ main ]
    paths:
      - 'Filtro_Python/**'
      - 'requirements.txt'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Filtro_Python/**'
      - 'requirements.txt'
      - '.github/workflows/python-ci.yml'
  workflow_dispatch:

env:
  # Run JavaScript actions on Node 24 instead of the default Node 20
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Pylint code analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.12', '3.13' ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pylint

      - name: Run Pylint
        # The Python code lives in Filtro_Python/, which is not a package:
        # --recursive=y is required for pylint to walk the directory
        run: pylint --recursive=y Filtro_Python --ignore=venv,tests,migrations,static --exit-zero

      - name: Check that the application imports
        working-directory: Filtro_Python
        run: python -c "import app; print('Flask app OK:', app.app.name)"

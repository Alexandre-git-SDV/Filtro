# Dependabot configuration for Filtro
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # --- Rust dependencies (Filtro_Rust/Cargo.toml) ---
  - package-ecosystem: "cargo"
    directory: "/Filtro_Rust"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "05:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "[BOT] Cargo :"
    labels:
      - "dependencies"
      - "rust"
    groups:
      # Group minor and patch bumps into a single PR
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- Actions used in .github/workflows/ ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "05:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "[BOT] CI :"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-all:
        patterns:
          - "*"

  # --- Base image of the Dockerfile ---
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "05:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "[BOT] Docker :"
    labels:
      - "dependencies"
      - "docker"
